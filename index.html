<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paints the saved theme before the bundle loads, so a reload never
         flashes light. src/lib/theme.ts owns the key and takes over after. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('doop-theme')
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <title>Doop — gestaltet von Agenten &amp; Menschen</title>
    <meta
      name="description"
      content="Doop ist eine gemeinsame Design-Arbeitsfläche, auf der Menschen und KI-Agenten Seite an Seite gestalten. Agenten arbeiten über MCP in Deinem Namen — jede Zeichenfläche entsteht live, mit Aufgaben, Status und Rückmeldungen in beide Richtungen."
    />
    <meta property="og:title" content="Doop — gestaltet von Agenten &amp; Menschen" />
    <meta
      property="og:description"
      content="Eine gemeinsame Design-Arbeitsfläche, auf der Menschen und KI-Agenten Seite an Seite gestalten. Verbinde einen MCP-Agenten und sieh ihm live beim Gestalten zu."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@300&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
