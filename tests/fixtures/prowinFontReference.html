<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        width: 640px;
        height: 360px;
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 640px;
        height: 360px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { FRAME_BOOTSTRAP } from '/src/lib/frameRuntime.ts'
      window.messages = []
      window.addEventListener('message', (event) => window.messages.push(event.data))
      const frame = document.createElement('iframe')
      frame.sandbox = 'allow-scripts'
      frame.srcdoc = FRAME_BOOTSTRAP
      document.body.appendChild(frame)
      window.renderHTML = (html, reqId) => frame.contentWindow.postMessage({ type: 'doop:html', html, reqId }, '*')
      window.testReady = true
    </script>
  </body>
</html>
