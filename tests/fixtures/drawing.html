<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin: 0">
    <div id="root" style="position: absolute; inset: 40px 0 0; height: auto; overflow: hidden"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { Stage } from '/src/components/Stage.tsx'
      import { useStore } from '/src/lib/store.ts'
      import { undo, redo } from '/src/lib/history.ts'
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx'
      import { requestFrame } from '/src/lib/frameBridge.ts'
      import '/src/styles.css'
      window.drawingHarness = {
        seed: (canvas) => useStore.getState().setCanvas(canvas),
        comments: (comments) => useStore.getState().setComments(comments),
        viewport: (viewport) => useStore.getState().setViewport(viewport),
        camera: () => useStore.getState().viewport,
        /* a collaborator's cursor at a world point */
        peer: (cursor) =>
          useStore.setState({
            presences: { peer: { clientId: 'peer', name: 'Peer', color: '#e0457b', kind: 'human' } },
            cursors: { peer: cursor },
          }),
        page: (id) => useStore.getState().setActivePage(id),
        state: () => ({
          frames: useStore.getState().canvas?.frames,
          tool: useStore.getState().tool,
          selectedElement: useStore.getState().selectedElement,
        }),
        undo,
        redo,
        /* true once the frame's live runtime answers a round-trip: store
           updates can precede the frame's throttled render, and pointer
           hit tests posted before registration are never answered */
        ping: (frameId) => requestFrame(frameId, 'doop:hover', { x: -10, y: -10 }).then((reply) => reply !== null),
      }
      createRoot(document.getElementById('root')).render(
        React.createElement(
          TooltipProvider,
          null,
          React.createElement(Stage, { onAddFrame: () => {}, sidePanelOpen: false }),
        ),
      )
    </script>
  </body>
</html>
